[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vent-weaning-readiness-agent"
version = "2.0.0"
description = "VentWean Sentinel: Mechanical Ventilation Liberation & RSBI Readiness Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["agents", "vent_weaning_readiness_agent"]
py-modules = ["vent_wean_sentinel", "enrichment", "simulator", "cli",
              "vent_wean_sentinel_app", "vent_weaning_readiness_agent_app"]

[project.scripts]
vent-weaning-readiness-agent = "vent_weaning_readiness_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/vent-weaning-readiness-agent"
Repository = "https://github.com/abusuraihsakhri/vent-weaning-readiness-agent.git"
