name: Test, Package, and Browser Checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "testing-only-ci-key-not-for-real-deployments-32chars"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q agents vent_weaning_readiness_agent vent_wean_sentinel.py enrichment.py
          pytest -q
          python vent_wean_sentinel.py rsbi --rr 20 --vt 400
          python -m vent_weaning_readiness_agent.cli --help
      - name: Browser calculator and JavaScript checks
        run: |
          node --check web/calculator.js
          node --check web/app.js
          node --test web/test_calculator.cjs
      - name: Verify tamper-evident chain
        run: |
          python - <<'PY'
          from agents.base import AuditLogger
          AuditLogger.log("ci", "test", "INTEGRITY_CHECK", {"synthetic": True})
          assert AuditLogger.verify_integrity()
          PY
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build
